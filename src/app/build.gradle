
plugins {
    id 'com.android.application'
}
android {

    namespace 'zixing.bluetooth.unlocker'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    applicationVariants.all {
        variant ->
            variant.outputs.all { output ->
                def appName = "mibluetoothunlocker" // 获取应用名称
                def versionName = variant.versionName // 获取版本名称
                //def versionCode = variant.versionCode // 获取版本号
                def timestamp = new Date().format("yyMMdd_HHmm") // 获取当前时间的格式化字符串
                def buildType = variant.buildType.name // 获取构建类型名称
                // 生成 APK 文件名
                def newName = "${appName}_v${versionName}_${buildType}_${timestamp}.apk"
                outputFileName = newName
            }
    }
    defaultConfig {
        applicationId "zixing.bluetooth.unlocker"
        minSdk 29
        //noinspection ExpiredTargetSdkVersion
        targetSdk 31
        versionCode 55
        versionName '5.1.3'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
//            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        merge 'META-INF/xposed/java_init.list'
        merge 'META-INF/xposed/module.prop'
        merge 'META-INF/xposed/scope.list'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

tasks.configureEach { task ->
    if (task.name.toLowerCase().contains("aarmetadata")) {
        task.enabled = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    implementation 'com.getbase:floatingactionbutton:1.10.1'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}